name: Build KSDid Tweak

on:
  push:
    paths:
      - 'kstweak/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos dependencies
        run: brew install ldid dpkg xz

      - name: Install Theos
        run: |
          export THEOS="$HOME/theos"
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"

      - name: Link iOS SDK
        run: |
          mkdir -p "$THEOS/sdks"
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          ln -sf "$SDK" "$THEOS/sdks/iPhoneOS.sdk"
          echo "SDK=$SDK"
          ls -la "$THEOS/sdks/"

      - name: Build tweak
        working-directory: kstweak
        run: |
          set -e
          export ARCHS="arm64 arm64e"
          make clean 2>/dev/null || true
          make package FINALPACKAGE=1 ARCHS="arm64 arm64e" THEOS_PACKAGE_ARCH=iphoneos-arm64 2>&1 | tail -40
          echo "=== 产物 ==="
          ls -la packages/ || true

      - name: Force arm64e architecture in deb
        working-directory: kstweak
        run: |
          set -e
          DEB=$(ls packages/*.deb 2>/dev/null | head -1)
          if [ -z "$DEB" ]; then echo "没有产出 deb"; exit 1; fi
          echo "原始 deb: $DEB"
          echo "原始架构: $(dpkg-deb -f "$DEB" Architecture)"

          # ★ Theos 会用 ARCHS 覆盖 control 里的 Architecture，
          #   这里解包→改 control→重打包，强制成 iphoneos-arm64e
          WORK=$(mktemp -d)
          dpkg-deb -R "$DEB" "$WORK"
          sed -i '' 's/^Architecture:.*/Architecture: iphoneos-arm64/' "$WORK/DEBIAN/control" || \
            sed -i 's/^Architecture:.*/Architecture: iphoneos-arm64/' "$WORK/DEBIAN/control"
          cat "$WORK/DEBIAN/control"
          dpkg-deb -b "$WORK" "$DEB"
          rm -rf "$WORK"

          echo "=== 最终架构 ==="
          dpkg-deb -f "$DEB" Architecture
          dpkg-deb -c "$DEB"

      - name: Verify deb
        working-directory: kstweak
        run: |
          set -e
          DEB=$(ls packages/*.deb 2>/dev/null | head -1)
          ARCH=$(dpkg-deb -f "$DEB" Architecture)
          echo "最终架构: $ARCH"
          case "$ARCH" in
            iphoneos-arm64*)
              echo "架构 OK: $ARCH" ;;
            *)
              echo "⚠ 架构异常: $ARCH" ;;
          esac
          dpkg-deb -x "$DEB" /tmp/x
          find /tmp/x -name '*.dylib' -exec file {} \;

          # ★ 校验安装路径：必须是 /Library/... 而非 /var/jb/Library/...
          #   实测能工作的插件（ksextract）deb 里路径为 /Library/MobileSubstrate/...
          #   靠 control 的 Pre-Depends: rootless-compat 转换成 /var/jb 并触发 RootHide 镜像。
          echo "=== deb 内路径 ==="
          dpkg-deb -c "$DEB" | awk '{print $NF}' | grep -E 'KSDid' || true
          if dpkg-deb -c "$DEB" | grep -q '/var/jb/Library'; then
            echo "⚠ 路径含 /var/jb 前缀，RootHide 可能不镜像"
          else
            echo "路径正确（无 /var/jb 前缀）✓"
          fi
          echo "=== control ==="
          dpkg-deb -f "$DEB" Pre-Depends

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: ks-did-tweak
          path: kstweak/packages/*.deb
          if-no-files-found: error
